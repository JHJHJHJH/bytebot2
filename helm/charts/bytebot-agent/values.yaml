replicaCount: 1

image:
  repository: ghcr.io/jhjhjhjh/bytebot-agent
  tag: edge
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 9991
  targetPort: 9991
  annotations: {}

resources:
  limits:
    memory: "2Gi"
    cpu: "1000m"
  requests:
    memory: "1Gi"
    cpu: "500m"

nodeSelector: {}

tolerations: []

affinity: {}

env:
  DATABASE_URL: ""
  BYTEBOT_DESKTOP_BASE_URL: "http://bytebot-desktop:9990"
  BYTEBOT_LLM_PROXY_URL: ""
  # Optional legacy API key values for backward compatibility. Normal
  # deployments can leave these empty and add provider keys in the UI at /models.
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""

# Optional pre-seeded API key secrets for automated deployments. Not required
# when users register provider keys in the UI at /models.
apiKeys:
  anthropic:
    useExisting: false
    secretName: ""
    secretKey: "anthropic-api-key"
    value: ""  # Only used if useExisting is false
  openai:
    useExisting: false
    secretName: ""
    secretKey: "openai-api-key"
    value: ""  # Only used if useExisting is false
  gemini:
    useExisting: false
    secretName: ""
    secretKey: "gemini-api-key"
    value: ""  # Only used if useExisting is false

config:
  databaseUrl: "postgresql://postgres:postgres@bytebot-postgresql:5444/bytebotdb"
  bytebotDesktopUrl: "http://bytebot-desktop:9990"
  llmProxyUrl: ""
  configDir: "/data/bytebot-agent"

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: bytebot-agent.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

postgresql:
  enabled: true
  auth:
    username: postgres
    password: postgres
    database: bytebotdb
  service:
    port: 5444
  primary:
    persistence:
      enabled: true
      size: 10Gi

externalDatabase:
  host: ""
  port: 5444
  database: bytebotdb
  username: postgres
  password: postgres
  existingSecret: ""
  existingSecretPasswordKey: ""
